[KeyMouse]
; VK code that holds the LEFT mouse button while pressed (0x7C = F13), 0 = off
Left=0x7C
; VK code that holds the RIGHT mouse button (0x7D = F14), 0 = off
Right=0x7D
Middle=0
Poll=4
; 1 = swap left and right mouse buttons in this game (B = select, A = command)
SwapButtons=1
; a left click right after a cursor jump this big (px) within this many ms is a touch tap and is not swapped
TouchJumpPx=48
TouchWindowMs=250
